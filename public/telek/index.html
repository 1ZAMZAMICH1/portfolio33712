<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>CRT Television</title>
  <link rel="stylesheet" href="rgdf.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    effects, light, screen {
      pointer-events: none !important;
    }
    crt > div > div {
      transform: none !important;
      animation: none !important;
    }
    
    /* Слой 1: сама страница (iframe) */
    crt > div { z-index: 1 !important; }
    
    /* Слой 2: рамка кинескопа (обрезает острые углы страницы) */
    screen { z-index: 2 !important; }
    
    /* Слой 3 и 4: пиксели и блики поверх рамки */
    effects { z-index: 3 !important; }
    light { z-index: 4 !important; }
  </style>
</head>
<body>

<content>
  <set>

    <crt>

      <screen>
        <u>
          <u></u> <u></u> <u></u> <u></u>
        </u>
        <u></u>
        <u></u>
      </screen>
      <div>
        <div style="position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; pointer-events: auto;">
          <iframe 
            src="/" 
            style="width: 100%; height: 100%; border: none; display: block;" 
            title="Portfolio">
          </iframe>
        </div>
      </div>
      <effects class="squircle">
        <u></u>
      </effects>
      <tune class="squircle"></tune>
      <light>
        <u></u><u></u><u></u><u></u>
        <u>
          window
          <u><u></u><u></u></u>
          curtains
          <u><u></u><u></u></u>
          <u></u>
          <u></u>
          horizontal reflections
          <u></u>
          <u></u>
        </u>
      </light>
    </crt>
    <panel>
      <grill>
        <speaker> </speaker>
        <u></u> <u></u> <u></u> <u></u> <u></u> <u></u> <u></u> <u></u> <u></u> <u></u>
        <u></u> <u></u> <u></u> <u></u> <u></u> <u></u> <u></u> <u></u> <u></u> <u></u>
        <u></u> <u></u> <u></u> <u></u> <u></u> <u></u> <u></u> <u></u> <u></u> <u></u>
        <u></u> <u></u> <u></u> <u></u>
      </grill>
      <knobs>
        <div class="power d-flex">
          <flex>
            <span class="my-md d-block text-center text-white">Power</span>
            <label for="on-off" title="Power"></label>
          </flex>
          <flex class="vol">
            <span class="my-md d-block text-center text-white">Volume</span>
            <u>
              <u><u></u></u>
              <dialvol>
                <label for="vol1"></label>
                <label for="vol2"></label>
                <label for="vol3"></label>
                <label for="vol4"></label>
              </dialvol>
            </u>
          </flex>
        </div>
        <div class="tuning">
          <span class="my-md d-block text-center text-white">Tuning</span>
          <u>
            <u><u></u></u>
            <dial>
              <label for="tune1"></label>
              <label for="tune2"></label>
              <label for="tune3"></label>
              <label for="tune4"></label>
            </dial>
            <label for="unclick"></label>
          </u>
        </div>
        <div>
          <a class="badge" href="https://tinydesign.co.uk/" target="_blank" title="Ben Evans Portfolio">
            <u class="sig"><u></u></u>
          </a>
        </div>
      </knobs>
    </panel>
  </set>
</content>

<input type="checkbox" name="tv" id="on-off" checked />
<input type="radio" name="tv" id="tune1" />
<input type="radio" name="tv" id="tune2" />
<input type="radio" name="tv" id="tune3" checked />
<input type="radio" name="tv" id="tune4" />
<input type="radio" name="tv" id="unclick" />

<input type="radio" name="vol" id="vol1" />
<input type="radio" name="vol" id="vol2" checked />
<input type="radio" name="vol" id="vol3" />
<script>
  const iframe = document.querySelector('iframe');
  if (iframe) {
    iframe.addEventListener('load', () => {
      try {
        const doc = iframe.contentDocument || iframe.contentWindow.document;
        doc.body.style.zoom = '0.80';
        const style = doc.createElement('style');
        style.textContent = `
          ::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }
          html, body { scrollbar-width: none !important; -ms-overflow-style: none !important; }
        `;
        doc.head.appendChild(style);
      } catch (e) {}
    });
  }
</script>

</body>
</html>
